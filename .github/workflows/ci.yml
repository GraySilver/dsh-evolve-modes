name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Harness ${{ matrix.dsh-version }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dsh-version: [0.2.1-rc.2, 0.2.1-rc.5]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Select Harness package set
        env:
          DSH_VERSION: ${{ matrix.dsh-version }}
        run: >-
          node --input-type=module -e
          "import fs from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const packages = Object.keys(packageJson.devDependencies)
            .filter(name => name.startsWith('@deepseek-ai/dsh-'))
            .map(name => name + '@' + process.env.DSH_VERSION);
          const result = spawnSync('pnpm', ['add', '--save-dev', '--save-exact', ...packages], { stdio: 'inherit' });
          process.exit(result.status ?? 1);"

      - name: Check peer dependency graph
        run: pnpm install --strict-peer-dependencies

      - name: Type-check package
        run: pnpm run typecheck

      - name: Build package artifacts
        run: pnpm run build

      - name: Run test suite
        run: pnpm test

      - name: Smoke-load host entry
        run: node -e "import('./lib/index.js')"

      - name: Validate npm package archive
        run: npm pack --dry-run --ignore-scripts
